<style>
  :root {
    /* Flexoki Base Colors */
    --flexoki-black: #100F0F;
    --flexoki-paper: #FFFCF0;
    
    /* Flexoki Base Shades */
    --flexoki-50: #F2F0E5;
    --flexoki-100: #E6E4D9;
    --flexoki-150: #DAD8CE;
    --flexoki-200: #CECDC3;
    --flexoki-300: #B7B5AC;
    --flexoki-600: #6F6E69;
    --flexoki-850: #343331;
    --flexoki-950: #1C1B1A;
    
    /* Flexoki Dark Base Shades */
    --flexoki-dark-50: #1C1B1A;
    --flexoki-dark-100: #282726;
    --flexoki-dark-150: #343331;
    --flexoki-dark-200: #403E3C;
    --flexoki-dark-300: #575653;
    
    /* Flexoki Accent Colors - Light */
    --flexoki-red: #AF3029;
    --flexoki-orange: #BC5215;
    --flexoki-yellow: #AD8301;
    --flexoki-green: #66800B;
    --flexoki-cyan: #24837B;
    --flexoki-blue: #205EA6;
    --flexoki-purple: #5E409D;
    --flexoki-magenta: #A02F6F;
    
    /* Flexoki Accent Colors - Dark */
    --flexoki-red-dark: #D14D41;
    --flexoki-orange-dark: #DA702C;
    --flexoki-yellow-dark: #D0A215;
    --flexoki-green-dark: #879A39;
    --flexoki-cyan-dark: #3AA99F;
    --flexoki-blue-dark: #4385BE;
    --flexoki-purple-dark: #8B7EC8;
    --flexoki-magenta-dark: #CE5D97;
  }

  body {
    font-family: Verdana, sans-serif;
    margin: auto;
    padding: 20px;
    max-width: 720px;
    text-align: left;
    background-color: var(--flexoki-paper);
    word-wrap: break-word;
    overflow-wrap: break-word;
    line-height: 1.7;
    letter-spacing: 0.01em;
    color: var(--flexoki-600);
    font-size: 16px;
  }

  h1,
  h2,
  h3,
  h4,
  h5,
  h6,
  strong,
  b {
    color: var(--flexoki-black);
    letter-spacing: -0.02em;
  }

  h1 {
    font-size: 2.2em;
    margin: 0.5em 0 0.75em 0;
    line-height: 1.2;
  }

  h2 {
    font-size: 1.6em;
    margin: 1.4em 0 0.6em 0;
    line-height: 1.3;
  }

  h3 {
    font-size: 1.3em;
    margin: 1.3em 0 0.5em 0;
    line-height: 1.4;
  }

  h4, h5, h6 {
    font-size: 1.1em;
    margin: 1.2em 0 0.4em 0;
    line-height: 1.4;
  }

  a {
    color: var(--flexoki-blue);
  }

  .title {
    text-decoration: none;
    border: 0;
  }

  .title span {
    font-weight: 400;
  }

  nav a {
    margin-right: 10px;
  }

  textarea {
    width: 100%;
    font-size: 16px;
    background-color: var(--flexoki-50);
    color: var(--flexoki-black);
    border: 1px solid var(--flexoki-200);
  }

  input {
    font-size: 16px;
    background-color: var(--flexoki-50);
    color: var(--flexoki-black);
    border: 1px solid var(--flexoki-200);
  }

  p {
    margin: 1.2em 0;
    line-height: 1.7;
  }

  content {
    line-height: 1.7;
  }

  table {
    width: 100%;
  }

  img {
    max-width: 100%;
  }

  code {
    padding: 2px 5px;
    background-color: var(--flexoki-100);
    color: var(--flexoki-black);
  }

  pre code {
    color: var(--flexoki-black);
    display: block;
    padding: 20px;
    white-space: pre-wrap;
    font-size: 14px;
    overflow-x: auto;
    background-color: var(--flexoki-50);
  }

  div.highlight pre {
    background-color: initial;
    color: initial;
  }

  div.highlight code {
    background-color: unset;
    color: unset;
  }

  blockquote {
    border-left: 3px solid var(--flexoki-300);
    color: var(--flexoki-600);
    padding-left: 24px;
    margin: 1.5em 0;
    font-style: italic;
    line-height: 1.8;
  }

  footer {
    text-align: left;
  }

  .helptext {
    color: var(--flexoki-300);
    font-size: small;
  }

  .errorlist {
    color: var(--flexoki-orange);
    font-size: small;
  }

  /* blog posts */
  ul.blog-posts {
    list-style-type: none;
    padding: unset;
    margin: 1.5em 0;
  }

  ul.blog-posts li {
    display: flex;
    margin-bottom: 0.8em;
    line-height: 1.6;
  }

  ul.blog-posts li span {
    flex: 0 0 130px;
    font-size: 0.9em;
    color: var(--flexoki-300);
  }

  ul.blog-posts li a:visited {
    color: var(--flexoki-purple);
  }

  @media (prefers-color-scheme: light) {
    body {
      background-color: var(--flexoki-dark-50);
      color: var(--flexoki-200);
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6,
    strong,
    b {
      color: var(--flexoki-paper);
    }

    a {
      color: var(--flexoki-blue-dark);
    }

    code {
      background-color: var(--flexoki-dark-200);
      color: var(--flexoki-paper);
    }

    pre code {
      color: var(--flexoki-paper);
      background-color: var(--flexoki-dark-100);
    }

    blockquote {
      color: var(--flexoki-300);
      border-left-color: var(--flexoki-dark-300);
    }

    textarea,
    input {
      background-color: var(--flexoki-dark-150);
      color: var(--flexoki-paper);
      border-color: var(--flexoki-dark-300);
    }

    .helptext {
      color: var(--flexoki-dark-300);
    }

    ul.blog-posts li a:visited {
      color: var(--flexoki-purple-dark);
    }
  }

  @media (prefers-color-scheme: dark) {
    body {
      background-color: var(--flexoki-dark-50);
      color: var(--flexoki-200);
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6,
    strong,
    b {
      color: var(--flexoki-paper);
    }

    a {
      color: var(--flexoki-blue-dark);
    }

    code {
      background-color: var(--flexoki-dark-200);
      color: var(--flexoki-paper);
    }

    pre code {
      color: var(--flexoki-paper);
      background-color: var(--flexoki-dark-100);
    }

    blockquote {
      color: var(--flexoki-300);
      border-left-color: var(--flexoki-dark-300);
    }

    textarea,
    input {
      background-color: var(--flexoki-dark-150);
      color: var(--flexoki-paper);
      border-color: var(--flexoki-dark-300);
    }

    .helptext {
      color: var(--flexoki-dark-300);
    }

    ul.blog-posts li a:visited {
      color: var(--flexoki-purple-dark);
    }
  }

  summary.clickable-header.big-top-pull {
    display: inline;
    cursor: pointer;
    position: relative;
    margin-bottom: -100px;
    margin-top: -20px;
  }

  summary.clickable-header.small-top-pull {
    display: inline;
    cursor: pointer;
    position: relative;
    margin-bottom: -100px;
    margin-top: -5px;
  }

  .clickable-header h4::before {
    content: "▶";
    margin-right: 5px;
  }

  details[open] .clickable-header h4::before {
    content: "▼";
  }

  /* Whimsical Eyes */
  .eyes-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: -1;
    overflow: hidden;
  }

  .eye {
    position: absolute;
    opacity: 0;
    transition: opacity 0.5s ease-in-out, transform 0.3s ease;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  .eye.visible {
    opacity: 0.8;
  }

  /* Cat Eyes */
  .cat-eye {
    width: 20px;
    height: 12px;
    background: var(--flexoki-yellow);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    position: relative;
  }

  .cat-eye::before {
    content: '';
    position: absolute;
    top: 2px;
    left: 50%;
    transform: translateX(-50%);
    width: 2px;
    height: 8px;
    background: var(--flexoki-black);
    border-radius: 2px;
  }


  /* Predator Eyes */
  .predator-eye {
    width: 16px;
    height: 20px;
    background: var(--flexoki-yellow);
    border-radius: 50%;
    position: relative;
    box-shadow: inset 0 -4px 8px rgba(0,0,0,0.3);
  }

  .predator-eye::before {
    content: '';
    position: absolute;
    top: 2px;
    left: 50%;
    transform: translateX(-50%);
    width: 1px;
    height: 16px;
    background: var(--flexoki-black);
    border-radius: 1px;
  }


  /* Blink Animation */
  @keyframes blink {
    0%, 90%, 100% { transform: scaleY(1); }
    95% { transform: scaleY(0.1); }
  }

  @keyframes predatorBlink {
    0%, 90%, 100% { transform: scaleX(1); }
    95% { transform: scaleX(0.1); }
  }

  .eye.blinking {
    animation: blink 3s infinite;
  }

  .predator-eye.blinking {
    animation: predatorBlink 3s infinite;
  }

  /* Dark theme adjustments */
  @media (prefers-color-scheme: dark) {
    .cat-eye, .predator-eye {
      background: var(--flexoki-yellow-dark);
    }
  }
</style>
